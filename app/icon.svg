<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Mirrors the Navbar lockup in components/ui/Logo.tsx: a brand-blue rounded
    tile holding a wrench. The glyph is drawn as solid mass rather than the
    1.7px stroke the Icon component uses - a stroked outline dissolves into an
    unreadable smudge once rasterised to 16px.
  -->
  <rect width="32" height="32" rx="7" fill="#1c58f4"/>
  <line x1="19.5" y1="12.5" x2="9.5" y2="22.5" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <circle cx="20.5" cy="11.5" r="6.2" fill="#fff"/>
  <polygon points="20.5,11.5 29.7,9.2 23.3,2.8" fill="#1c58f4"/>
</svg>
